[package]
name = "singlefs-checker-tier"
version = "0.1.0"
publish = false
edition = "2021"
description = "checker 档：崩溃态枚举引擎、记录核对器、oracle、断点续跑、崩溃注入与坏盘输入战役、真设备与实验装置，以及它们的用例；默认只在提交时跑（D13 已定项 15，.claude/rules/verification.md）。判决器库在 singlefs-checker，脚手架在 singlefs-harness"

[dependencies]
singlefs-checker = { path = "../singlefs-checker" }
singlefs-core = { path = "../singlefs-core" }
singlefs-format = { path = "../singlefs-format" }
singlefs-harness = { path = "../singlefs-harness" }
# RefFS（D13（验证路线） 已定项 3，E171 第 1 次重跑登记修订 2 第 2.3 节）：checker 档的装置只读它、只调它判允许集合，不改它的源码，它的依赖闭包与单测归它自己（harness 档）。
singlefs-reference-filesystem = { path = "../singlefs-reference-filesystem" }
# 崩溃放量的判定存储（src/verdict_store.rs，里程碑三第十一项；用户 2026-09-28 选 RocksDB）。版本钉成与 scripts/experiments/Cargo.lock 相同，
# E162（崩溃放量判定块存储选型） K 臂杀进程量的就是这一版，默认特性也照那边不动（K 臂用的 LZ4 压缩在默认特性里）。
# 只进 checker 档：harness 档、池级 checker、core 都不依赖它（.claude/rules/verification.md「定义与名字」，门禁 94 号）。
# librocksdb-sys 在每个编译目录里现编一遍 C++；它的 bindgen 在本机找不到 stdbool.h（只有 libclang、没有 clang 的头文件），
# 要 BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/x86_64-linux-gnu/13/include 才编得过（与 scripts/experiments/Cargo.toml 同一条）。
rocksdb = { version = "=0.25.0", optional = true }
# 崩溃放量的 GPU 核对（src/gpu_unit_checks.rs）：版本与特性钉成 E163（GPU多卡算单元校验和） 装置用的那一份（scripts/experiments/Cargo.toml）。
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"], optional = true }
pollster = { version = "=1.0.1", optional = true }

[features]
# 判定存储（src/verdict_store.rs）与它的 RocksDB 依赖：崩溃点重放枚举与按序号段判只吃从库里读回的流（src/crash_library.rs），默认就编；
# 关掉（--no-default-features）编不过（src/lib.rs 的 compile_error）。
default = ["verdict-store"]
verdict-store = ["dep:rocksdb"]
# GPU 核对默认不编：配置里 ENABLE_GPU=1 的跑法才开（单机或双机的 CPU + GPU）。
gpu = ["dep:wgpu", "dep:pollster"]
