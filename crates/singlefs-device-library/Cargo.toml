description = "实验装置读写判定库的口子：经起装置的 scripts/experiment-apparatus/device-code-key.py run 开的两根管道一问一答，转给 prune-server 的那一份判定库；只用 std，不依赖工作区任何 crate。用到它的装置按 path 依赖引"

