# 攻方腿 m3-formal-code-b26-r1 的探针：只读导入冻结副本里的 crates，不改它们。
# 复跑时 tools/rerun.sh 把 probe/ 与冻结副本拷进 WORK，WORK/probe 与 WORK/tree 平级。
[package]
name = "opus-b26-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
singlefs-core = { path = "../tree/crates/singlefs-core" }
singlefs-format = { path = "../tree/crates/singlefs-format" }
singlefs-checker = { path = "../tree/crates/singlefs-checker" }
singlefs-harness = { path = "../tree/crates/singlefs-harness" }
singlefs-checker-tier = { path = "../tree/crates/singlefs-checker-tier" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
debug-assertions = true
