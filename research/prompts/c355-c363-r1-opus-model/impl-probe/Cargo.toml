[package]
name = "c355-c363-r1-opus-impl-probe"
version = "0.1.0"
edition = "2021"
publish = false

# 自成一个 workspace。依赖钉在提交 fbae43e 的 crates/ 导出副本上（另一个会话同时在改工作区里的 crates/）：
# git archive fbae43e crates | tar -x -C /tmp/claude-1000/c355-head
[workspace]

[dependencies]
singlefs-core = { path = "/tmp/claude-1000/c355-head/crates/singlefs-core" }
singlefs-format = { path = "/tmp/claude-1000/c355-head/crates/singlefs-format" }
