[package]
name = "m3r1-opus-proto"
version = "0.1.0"
publish = false
edition = "2021"
description = "m3-code-r1 云端攻方腿的原型（只在草稿副本里）：造盘面跑 harness 档的入口与可写挂载；崩溃态那一条调 singlefs-checker-tier 的枚举函数跑自己造的小流，不跑 checker 档包自己的测试"

[dependencies]
libc = "0.2"
singlefs-checker = { path = "../singlefs-checker" }
singlefs-checker-tier = { path = "../singlefs-checker-tier" }
singlefs-core = { path = "../singlefs-core" }
singlefs-format = { path = "../singlefs-format" }
singlefs-harness = { path = "../singlefs-harness" }
