[package]
name = "b36-opus-naga"
version = "0.1.0"
publish = false
edition = "2021"
description = "第 36 批代码轮第一轮攻方原型：36-2 前后两个池级 checker 内核与 GPU 变异行改过的内核经 naga 解析、校验、数展开后的表达式（不上卡）"

[[bin]]
name = "b36naga"
path = "src/main.rs"

[dependencies]
singlefs-checker-tier = { path = "../singlefs-checker-tier", features = ["gpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
