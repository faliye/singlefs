# 攻方原型（m3-batch63-code-r1 opus）：tools/rerun.sh 拷进仓副本的 crates/opus-probe-b63，并把它加成副本工作区成员；不进主工作区。
# 被测的 verdict_store.rs 由 gen.py 从冻结副本逐字拷成 src/verdict_store_under_test.rs（可选打一处变异、在单测模块末尾接上攻方用例），
# 当本 crate 的一个模块编；它引的 crash_identity、crash_judge_conclusions 两个模块经 src/lib.rs 从 checker 档库转出。
# 测试目标只有本 crate 的 lib 单测；名字不带 layer0，不开 gpu 特性，不依赖 checker 档的测试二进制。
[package]
name = "opus-probe-b63"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
singlefs-checker-tier = { path = "../singlefs-checker-tier" }
rocksdb = { version = "=0.25.0" }
