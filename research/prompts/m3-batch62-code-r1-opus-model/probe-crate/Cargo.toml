# 攻方原型（m3-batch62-code-r1 opus）：rerun.sh 拷进仓副本的 crates/opus-probe-b62，并改副本根 Cargo.toml 把它加成工作区成员；不进主工作区。
# 只依赖判定库的公开接口与 expose.py 在副本里加的两个公开包装（按给定批长导入、列整库的键值行）；测试目标名不带 layer0，不开 gpu 特性。
[package]
name = "opus-probe-b62"
version = "0.1.0"
publish = false
edition = "2021"

[features]
default = ["verdict-store"]
verdict-store = ["singlefs-checker-tier/verdict-store"]

[dependencies]
singlefs-checker-tier = { path = "../singlefs-checker-tier" }
