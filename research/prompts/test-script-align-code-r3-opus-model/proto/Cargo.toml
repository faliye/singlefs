# test-script-align-code-r3 攻方腿的原型（只在草稿副本上编、跑）：依赖仓副本 ../tree 的几个包（副本里加了 r2 的看判器输入原文的口子
# patch_tree.py 与本腿的 patch_mutations.py：四行变异各一个环境变量开关，默认关、与冻结副本同义），不进主仓 workspace。
[package]
name = "r3proto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
singlefs-checker-tier = { path = "../tree/crates/singlefs-checker-tier", features = ["verdict-store", "gpu"] }
singlefs-checker = { path = "../tree/crates/singlefs-checker" }
singlefs-core = { path = "../tree/crates/singlefs-core" }
singlefs-format = { path = "../tree/crates/singlefs-format" }
singlefs-harness = { path = "../tree/crates/singlefs-harness" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
debug-assertions = true
