# singlefs workspace（里程碑「新池新建文件」步 0 的脚手架，2026-09-14）。
# research/ 是实验 workspace，自己有 Cargo.toml，这里显式排除。
[workspace]
resolver = "2"
members = [
    "crates/singlefs-format",
    "crates/singlefs-core",
    "crates/singlefs-replay-prefix",
    "crates/singlefs-harness",
    "crates/singlefs-checker",
    "crates/singlefs-checker-tier",
    "crates/singlefs-reference-filesystem",
]
exclude = ["research"]

# 与 research/Cargo.toml 同一条理由：release 默认关掉整数溢出检查，溢出会变成静默回绕。
[profile.release]
opt-level = 3
debug = true
overflow-checks = true
# debug_assert! 在 release 下也开（.claude/singlefs-ai-sop/rules/test-script-discipline.md「编译与算法都要快」）
debug-assertions = true
