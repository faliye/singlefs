# test-script-align-code-r1 攻方腿的原型（只在草稿副本上编、跑）：依赖冻结副本拷贝里的四个包，不进主仓 workspace
[package]
name = "k2proto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["gpu"]
gpu = []

[dependencies]
singlefs-checker-tier = { path = "../tree/crates/singlefs-checker-tier", features = ["verdict-store", "gpu"] }
singlefs-checker = { path = "../tree/crates/singlefs-checker" }
singlefs-core = { path = "../tree/crates/singlefs-core" }
singlefs-format = { path = "../tree/crates/singlefs-format" }
singlefs-harness = { path = "../tree/crates/singlefs-harness" }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
pollster = { version = "=1.0.1" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
debug-assertions = true
