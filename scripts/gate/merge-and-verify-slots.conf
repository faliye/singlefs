# scripts/gate/merge-and-verify.sh 读它（那份脚本文件头「槽位」）：合入后验证的快照放在固定路径的槽里、一槽一个编译目录接着增量编。
# slots：至多几槽（槽在工作根下的 merge-and-verify/slot.<随机>/，两台都读得到；只在本机占槽，派到第二台的那一趟照一趟一份跑）；
#   只在按最近一次占用排的前 slots 槽里挑，排在后面的多出来的槽（调低了 slots 之后已有的）照样清，占着的、留着的跳过；
#   0 就是一趟都不占槽，每一趟照一趟一份那一种拷快照、从头编、收尾删，已有的槽照样清。
# slot-target-limit-gib：一槽的编译目录至多占多少 GiB（编译目录在本机多机配置 BUILD_ROOT_BY_HOST 那一项下的 merge-and-verify-slots/<槽名>/target）；
#   占到槽之后、编之前与收尾各量一次，超过就整个删掉，这一槽下一次从头编。本机至多 slots × slot-target-limit-gib（只在那几刻量，一趟编的过程中可以超过）。
# 只写这两行 <键>=<非负整数>，别的只许 # 起头的注释与空行；写坏了合入后验证退 1、一个补丁都不打。
slots=3
slot-target-limit-gib=150
