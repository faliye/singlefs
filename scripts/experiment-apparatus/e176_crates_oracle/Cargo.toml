# E176（inode 树叶合并三候选的容量与写代价）的对拍 bin 的独立 manifest：跑前登记 research/prompts/e176-preregistration.md 第三节、第十二节修订 2。
#
# 只有它以路径依赖引 crates/ 的 singlefs-core、singlefs-format（只读，拿 inode_tree.rs 的两个纯函数当 M1 的参照，不改 crates/）。
# 不挂在 scripts/experiment-apparatus 的可选特性上：可选的路径依赖照样要 cargo 读到 ../../crates 下的 manifest，
# scripts/mutation/mutate.sh 把 research/ 拷进临时目录编译时副本旁边没有 crates/，整个包每一张变异表的基线都编不过（2026-10-08 E176 执行员撞上）。
# 自己一个 workspace（下面的空 [workspace]），不进 research 的工作区，replay.sh 与门禁的研究构建都不编它。目录里没有 main.rs，
# e7-index-bench 的 bin 自动发现也不会把它当成一个 bin。
#
# 编：task-server/task submit -- cargo build --release --manifest-path scripts/experiment-apparatus/e176_crates_oracle/Cargo.toml（编译目录由服务给这一次的 CARGO_TARGET_DIR，task wait 末行 build=<目录>，用完 task-server/task clean <号>）
# 跑：task-server/task submit -- cargo run --release --manifest-path scripts/experiment-apparatus/e176_crates_oracle/Cargo.toml --bin e176-inode-leaf-merge-crates-oracle（编与跑在同一条任务里：派到第二台时编译目录在那一台本地、命令结束就删，不能编一条、再另交一条去跑编出来的文件）
[package]
name = "e176-crates-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies.singlefs-core]
path = "../../../crates/singlefs-core"

[dependencies.singlefs-format]
path = "../../../crates/singlefs-format"

[[bin]]
name = "e176-inode-leaf-merge-crates-oracle"
path = "oracle.rs"

# 与 scripts/experiment-apparatus/Cargo.toml 同一条理由：release 默认关掉整数溢出检查。
[profile.release]
opt-level = 3
debug = true
overflow-checks = true
