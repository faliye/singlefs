# 看门狗的配置：scripts/agents/watch.sh 读它，按行把 key=value 转成 agent-watch.py 的 --key value。
# key 就是 agent-watch.py 的长选项名去掉开头的 --；只写要改掉默认值的那几项，没写的照 agent-watch.py 自己的默认值。
# 值一律是整数。改了这里就是改了所有主 agent 以后起看门狗的口径，改之前先想清楚是哪一类告警太吵或太迟。
#
# 可写的 key（与 agent-watch.py 的默认值）：
#   interval-seconds 240        两次检查的间隔
#   max-minutes 60              没有告警也每隔这么久退出一次叫醒主 agent
#   tool-minutes 8              一次工具调用超过这么久告警
#   wait-loop-minutes 3         没有超时的等待循环跑过这么久告警
#   idle-minutes 10             没有工具在跑、记录这么久没动告警
#   repeat-count                同一命令反复且输出不变几次告警
#   context-tokens 700000       implementation-writer / experiment-runner 上下文到这么多报「该交接」，别的类型不报；写 0 不报（子 agent 上下文多大都不交回，看门狗只看它还在不在干活）
#   progress-stale-minutes 30   结束本轮在等后台任务的子 agent，派发提示点名的草稿目录里的 progress.md 这么久没改就报「进度文件不涨」；写 0 不报
#   process-report-minutes / process-stale-minutes / process-max-minutes
#   not-started-minutes / active-minutes / detection-poll-seconds
#   leftover-background-grace-minutes 2   子 agent 交回、被停或失败之后过了这么久，它起的后台任务还有进程开着输出文件就报「交回之后后台还在跑」
#   ask-every-minutes 60        还没交回的子 agent 从派发起每跑满这么久（整数倍，60 就是每个整点）报一次「跑满 N 小时要主 agent 问一次」，
#                               那一格之后主 agent 给它发过消息就不报；写 0 不报
#   process-rss-gibibytes 8     这个 Claude 实例底下任一进程常驻内存（RSS）超过这么多 GiB 就报「进程常驻内存过线」，两次整查之间也按
#                               detection-poll-seconds 单查一遍；写 0 不查。默认 8 的依据：本机 60 GiB，本地模型服务连同会话常驻约 12 GiB，
#                               同时可能有 3 件重活，每件分 (60 − 12) ÷ 3 = 16 GiB，取一件的一半；换机器要重算。涨得飞快的无界分配
#                               （E142 那条变异每秒约 5 GB）等不到它，只有 scripts/hosts/run-with-memory-cap.sh 的内存上限挡得住
#   kept-copy-hours 6           子 agent 交回超过这么多小时、交回报告里写了「没删 <全路径>」而那个路径还在，就报「交回之后副本还在」交主 agent 删；写 0 不查
#   scratch-idle-hours 6        有子 agent 交回时，草稿根（工作根整个；旧根 /tmp/claude-1000 下只看本会话的那一份）里的编译目录（带 CACHEDIR.TAG）与仓副本，
#                               最后修改距今超过这么多小时的，按最后修改时刻（最久没动的在前）列在看门狗的报告里，只报不删、不叫醒，交主 agent 核过没人在用再删；写 0 不查。
#                               默认 6 的依据：推的（没量过）——与 kept-copy-hours 同一档，一个子 agent 的一件活通常不到这么久，停了这么久的副本多半没人再用。
#   terminate-after-unacknowledged-reports 0   「进程卡住」类告警（工具调用过长、进程无输出、重型测试没带前缀）同一件事连报这么多次、主 agent 既没处置也没 --ack，
#                               看门狗就经 proc.py stop 终止那个进程并在报告里写「终止了 <pid>（<告警种类>，连报 N 次没处置）」；子 agent 的工具调用过长没有进程号，只报。
#                               写 0 不终止（agent-watch.py 的默认）。这里写 3：用户 2026-10-13 定「如果调度方没有响应，那么可以终止」，
#                               .claude/main-agent.md「派出去之后」第一段说连报几次都没处置、也没 --ack 的可以终止；3 次是推的（没量过），主 agent 有两次叫醒可以处置。
#                               连报次数记在会话的状态目录里，watch.sh 不带 agent 号或带 --processes 起的才记；带 agent 号起的没处记，不终止。

ask-every-minutes=0
context-tokens=0
kept-copy-hours=6
scratch-idle-hours=6
terminate-after-unacknowledged-reports=3
